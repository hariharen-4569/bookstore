<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Bookstore</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <div class="logo">📚 Admin Panel</div>
        <nav>
          
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>

    <main>
        <!-- Add Book Form -->
        <section class="books-management">
            <h2>Add New Book</h2>
            <button id="add-book-btn" class="btn">+ Add Book</button>

            <div id="book-form-container" class="hidden">
                <h3 id="form-title">Add New Book</h3>
                <form id="book-form">
                    <input type="hidden" id="book-id">
                    <label>Title:</label>
                    <input type="text" id="book-title" required>
                    <label>Price:</label>
                    <input type="text" id="book-price" required>
                    <label>Image URL:</label>
                    <input type="text" id="book-image" required>
                    <button type="submit" class="btn">Save Book</button>
                    <button type="button" id="cancel-btn" class="btn secondary">Cancel</button>
                </form>
            </div>
        </section>

        <!-- Books List -->
        <section class="books-list">
            <h2>Manage Books</h2>
            <div id="books-container"></div>
        </section>

        <!-- Orders Section -->
        <section class="orders-management">
            <h2>Customer Orders</h2>
            <div id="orders-list"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Online Bookstore. All rights reserved.</p>
    </footer>

    <script src="admin.js"></script>
</body>
</html>
