<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Online Bookstore</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header>
        <div class="logo">📚 BookStore</div>
        <nav>
            <a href="home.html">Home</a>
            <a href="books.html">Books</a>
            <a href="cart.html">Cart</a>
            <a href="login.html" id="auth-link">Logout</a>
        </nav>
        
    </header>

    <section class="hero">
        <h1>Discover Your Next Great Read</h1>
        <p>Explore thousands of books across different genres</p>
        <a href="books.html" class="btn">Browse Books</a>
    </section>

    <section class="categories">
        <h2>Popular Categories</h2>
        <div class="category-grid">
            <div class="category">Fiction</div>
            <div class="category">Science Fiction</div>
            <div class="category">Mystery</div>
            <div class="category">Business</div>
            <div class="category">Self-Help</div>
            <div class="category">Biography</div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Online Bookstore. All rights reserved.</p>
    </footer>

    <script>
        gsap.from(".hero h1", { duration: 1, opacity: 0, y: -50, ease: "power2.out" });
        gsap.from(".hero p", { duration: 1, opacity: 0, y: 50, delay: 0.2, ease: "power2.out" });
        gsap.from(".btn", { duration: 1, opacity: 0, scale: 0.5, delay: 0.4, ease: "back.out(1.7)" });

        gsap.from(".category", { opacity: 0, y: 50, stagger: 0.2, duration: 1, ease: "power2.out" });
    </script>



</body>
</html>
