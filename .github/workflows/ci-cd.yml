name: CI/CD Pipeline for Bookstore App

on:
  push:
    branches:
      - main  # Trigger the pipeline on push to the main branch
  pull_request:
    branches:
      - main  # Trigger the pipeline on pull requests targeting the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # Build the Docker image and push it to Docker Hub
          docker build -t hariharen4569/bookstore:latest .
          docker push hariharen4569/bookstore:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure this job runs only after the build job is successful

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v1

      - name: Set up Kubeconfig
        run: |
          # Ensure the Kubeconfig is correctly configured for your Kubernetes cluster
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Apply Kubernetes Deployment
        run: |
          # Ensure the path to your Kubernetes deployment file is correct
          kubectl apply -f k8s/deployment.yml

      - name: Verify Deployment
        run: |
          # Verify if the deployment was successful
          kubectl rollout status deployment/bookstore-deployment
