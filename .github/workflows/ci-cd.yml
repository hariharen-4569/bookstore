name: Build and Push to DockerHub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Log in to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" 
--password-stdin

    - name: Build Docker image
      run: docker build -t hariharen4569/bookstore .

    - name: Push to DockerHub
      run: |
        docker tag hariharen4569/bookstore:latest hariharen4569/bookstore:latest
        docker push hariharen4569/bookstore:latest

